<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f5f0;--card:#fff;--ink:#1b201d;--mut:#71787a;--line:#e7e2d8;--acc:#2f6f4e;--acc2:#c8622c;--warm:#fdf2e6;--nav:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2225;--ink:#eceff1;--mut:#98a0a4;--line:#2c3235;--warm:#2a221a;--nav:#1a1e21}}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;
 -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
#app{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
.top{background:linear-gradient(135deg,#2f6f4e,#3f8a62);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:19px;letter-spacing:-.2px}
.top p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.wrap{padding:14px 14px 0;max-width:640px;margin:0 auto}
.view{display:none} .view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px}
h2{font-size:17px;margin:18px 0 9px} h2:first-child{margin-top:4px}
h3{font-size:14px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.mut{color:var(--mut);font-size:13px}
/* selector de dia */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:54px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer}
.dchip b{display:block;font-size:17px;line-height:1.1} .dchip span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.dchip.on{background:var(--acc);border-color:var(--acc);color:#fff} .dchip.on span{color:#d8ece1}
.dchip.buy::after{content:"🛒";display:block;font-size:10px;margin-top:1px}
/* comidas */
.meal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.mico{font-size:22px;flex:0 0 30px;text-align:center;line-height:1.3}
.mtit{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin-bottom:2px}
.mtxt{font-size:15px}
.tech{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tech button{font:inherit;font-size:11.5px;font-weight:600;background:var(--warm);color:var(--acc2);border:none;border-radius:999px;padding:5px 11px;cursor:pointer}
/* compra */
.segs{display:flex;gap:8px;margin-bottom:12px}
.segs button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer}
.segs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:12px;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:15}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:9px 0 7px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.sec{margin:16px 0 6px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);padding-left:2px}
.it{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:7px;cursor:pointer}
.box{flex:0 0 24px;height:24px;border:2px solid #b9b3a7;border-radius:7px;position:relative;margin-top:1px}
.it.on .box{background:var(--acc);border-color:var(--acc)}
.it.on .box::after{content:"";position:absolute;left:7px;top:2px;width:5px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.it.on .iname{text-decoration:line-through;color:var(--mut)}
.ibody{flex:1;min-width:0}
.iname{font-weight:650;font-size:15px}
.imeta{font-size:12.5px;color:var(--mut);margin-top:1px}
.iprice{font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;font:inherit;font-size:14px;font-weight:700;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;margin-top:6px}
/* recetas */
.rec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rhead h4{margin:0;font-size:16px}
.rtime{font-size:11.5px;font-weight:700;color:#fff;background:var(--acc2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.rec p{margin:8px 0 0;font-size:14px;color:var(--ink)}
.tbtn{margin-top:11px;font:inherit;font-size:13.5px;font-weight:700;background:var(--acc);color:#fff;border:none;border-radius:11px;padding:10px 16px;cursor:pointer;width:100%}
/* timer overlay */
#timer{position:fixed;inset:0;background:rgba(12,20,16,.97);color:#fff;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#timer.on{display:flex}
#tname{font-size:17px;opacity:.8}
#tdisp{font-size:74px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-2px}
#timer .row{display:flex;gap:12px}
#timer button{font:inherit;font-size:15px;font-weight:700;padding:13px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
#timer button.pri{background:#fff;color:#14301f;border-color:#fff}
.ring{width:172px;height:172px;border-radius:50%;border:5px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.ring.done{border-color:#78d6a4;animation:pulse .8s infinite}
@keyframes pulse{50%{border-color:rgba(120,214,164,.25)}}
/* info */
ul.li{margin:0;padding-left:19px;font-size:14px} ul.li li{margin-bottom:9px}
.warn{background:var(--warm);border-left:4px solid var(--acc2);border-radius:0 12px 12px 0;padding:11px 13px;font-size:13.5px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 4px;border-bottom:1px solid var(--line)} td:last-child{text-align:right;font-weight:650;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:30;
 padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
nav button{flex:1;font:inherit;background:none;border:none;color:var(--mut);padding:9px 2px 8px;cursor:pointer;font-size:10.5px;font-weight:650}
nav button b{display:block;font-size:21px;font-weight:400;line-height:1.2;filter:grayscale(1) opacity(.65)}
nav button.on{color:var(--acc)} nav button.on b{filter:none}
.hint{background:var(--warm);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.hint b{cursor:pointer;color:var(--acc2)}
footer{font-size:11.5px;color:var(--mut);text-align:center;padding:18px 16px 8px}
</style></head><body>

/* ---- almacenamiento seguro: si el navegador lo bloquea, funciona en memoria ---- */
const mem = {};
const S = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){ return k in mem? mem[k]: d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
let state = { dia: S.get('dia',1), checked: S.get('checked',{}), compra: S.get('compra',1), inicio: S.get('inicio',null) };
const save=()=>{S.set('dia',state.dia);S.set('checked',state.checked);S.set('compra',state.compra);S.set('inicio',state.inicio);};
const eur = n => n.toFixed(2).replace('.',',')+' €';
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* dia automatico si marco fecha de inicio */
function diaAuto(){
  if(!state.inicio) return null;
  const ms = Date.now() - state.inicio;
  const d = Math.floor(ms/86400000)+1;
  return (d>=1 && d<=15) ? d : null;
}
const TECH = [
 [/arroz/i,'Arroz'],[/macarron|espagueti|pasta/i,'Pasta'],[/patata asada|patata al|puré de patata/i,'Patata asada'],
 [/vapor/i,'Verdura al vapor'],[/sofrito/i,'Sofrito base'],[/revuelto/i,'Huevo revuelto'],[/escalfado/i,'Huevo escalfado'],
 [/tortilla/i,'Tortilla en taza'],[/pollo/i,'Pollo'],[/lenteja|garbanzo|alubia/i,'Legumbre de bote'],
 [/puré/i,'Puré de patata'],[/sopa/i,'Sopa de verduras']
];
function tecnicas(txt){ const o=[]; TECH.forEach(([re,n])=>{ if(re.test(txt)&&!o.includes(n)) o.push(n); }); return o; }

/* ---------------- HOY ---------------- */
function renderHoy(){
  const auto = diaAuto(); if(auto) state.dia = auto;
  const m = D.menu[state.dia-1];
  const chips = D.menu.map(x=>`<div class="dchip${x.d===state.dia?' on':''}${(x.d===1||x.d===8)?' buy':''}" data-d="${x.d}"><b>${x.d}</b><span>día</span></div>`).join('');
  const meals = [['🌅','Desayuno',m.de],['☀️','Comida',m.co],['🍎','Media tarde',m.me],['🌙','Cena',m.ce]];
  const mealsHtml = meals.map(([i,t,x])=>{
     const tc = tecnicas(x).map(n=>`<button data-rec="${esc(n)}">⏱️ ${esc(n)}</button>`).join('');
     return `<div class="meal"><div class="mico">${i}</div><div style="flex:1"><div class="mtit">${t}</div>
       <div class="mtxt">${esc(x)}</div>${tc?`<div class="tech">${tc}</div>`:''}</div></div>`;}).join('');
  const buy = (state.dia===1||state.dia===8) ? `<div class="warn">🛒 Hoy toca <b>compra ${state.dia===1?1:2}</b>. Abre la pestaña Compra y ve marcando.</div>`:'';
  document.getElementById('v-hoy').innerHTML = `
   <div class="days">${chips}</div>
   <div class="wrap">
    ${S.get('_hint',1)?`<div class="hint"><span>📱</span><div>Instálala: menú de Chrome ⋮ → <b>Añadir a pantalla de inicio</b> (o «Instalar app»). Después funciona sin internet. <b id="dismiss">Ocultar</b></div></div>`:''}
    ${buy}
    ${mealsHtml}
    <button class="btn" id="setStart">${state.inicio?'Reiniciar la fecha de inicio del plan':'Marcar hoy como día 1 (avanza solo cada día)'}</button>
    <footer>Precios orientativos Mercadona · agosto 2026</footer>
   </div>`;
  document.querySelectorAll('.dchip').forEach(c=>c.onclick=()=>{state.dia=+c.dataset.d;state.inicio=null;save();renderHoy();});
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{ go('recetas'); setTimeout(()=>{
      const el=[...document.querySelectorAll('.rec')].find(r=>r.dataset.t===b.dataset.rec);
      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--acc)';setTimeout(()=>el.style.outline='',1600);} },80); });
  const ss=document.getElementById('setStart');
  if(ss) ss.onclick=()=>{ if(state.inicio){state.inicio=null;} else {const d=new Date();d.setHours(0,0,0,0);state.inicio=d.getTime();state.dia=1;} save(); renderHoy(); };
  const dm=document.getElementById('dismiss'); if(dm) dm.onclick=()=>{S.set('_hint',0);renderHoy();};
}

/* ---------------- COMPRA ---------------- */
function renderCompra(){
  const c = D.compras.find(x=>x.id===state.compra);
  const groups = {};
  c.items.forEach((it,i)=>{ (groups[it.s]=groups[it.s]||[]).push({...it,k:c.id+'-'+i}); });
  let total=0, hecho=0, pend=0, n=0, nh=0;
  c.items.forEach((it,i)=>{ total+=it.p; n++; if(state.checked[c.id+'-'+i]){hecho+=it.p;nh++;} else pend+=it.p; });
  const secs = D.secOrder.filter(s=>groups[s]).map(s=>`<div class="sec">${D.secIcon[s]||''} ${esc(s)}</div>`+
     groups[s].map(it=>`<div class="it${state.checked[it.k]?' on':''}" data-k="${it.k}"><div class="box"></div>
       <div class="ibody"><div class="iname">${esc(it.n)}</div><div class="imeta">${esc(it.f)}${it.u>1?' × '+it.u:''}${it.nota?' · '+esc(it.nota):''}</div></div>
       <div class="iprice">${eur(it.p)}</div></div>`).join('')).join('');
  document.getElementById('v-compra').innerHTML = `<div class="wrap">
    <div class="segs">${D.compras.map(x=>`<button data-c="${x.id}" class="${x.id===state.compra?'on':''}">${x.id===1?'Compra 1 · día 1':'Compra 2 · día 8'}</button>`).join('')}</div>
    <div class="prog"><div style="font-size:13px;color:var(--mut)">${esc(c.sub)}</div>
      <div class="bar"><i style="width:${n?Math.round(nh/n*100):0}%"></i></div>
      <div class="prow"><span>${nh} de ${n} productos</span><span>Faltan ${eur(pend)}</span></div>
      <div class="prow" style="margin-top:4px;color:var(--mut);font-weight:500"><span>En el carro ${eur(hecho)}</span><span>Total ${eur(total)}</span></div></div>
    ${secs}
    <button class="btn" id="reset">Desmarcar todo</button>
    <footer>Los precios son orientativos y pueden variar según la tienda.</footer></div>`;
  document.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{state.compra=+b.dataset.c;save();renderCompra();});
  document.querySelectorAll('.it').forEach(el=>el.onclick=()=>{
     const k=el.dataset.k; state.checked[k]=!state.checked[k]; save();
     if(navigator.vibrate) navigator.vibrate(12); renderCompra();});
  document.getElementById('reset').onclick=()=>{ c.items.forEach((_,i)=>delete state.checked[c.id+'-'+i]); save(); renderCompra(); };
}

/* ---------------- TEMPORIZADOR ---------------- */
let tInt=null, tLeft=0, tRun=false;
function fmt(s){ const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function startTimer(r){
  tLeft=r.sec; tRun=true;
  document.getElementById('tname').textContent=r.t;
  document.getElementById('tring').classList.remove('done');
  document.getElementById('tdisp').textContent=fmt(tLeft);
  document.getElementById('timer').classList.add('on');
  document.getElementById('tpause').textContent='Pausa';
  clearInterval(tInt);
  tInt=setInterval(()=>{ if(!tRun) return; tLeft--;
    document.getElementById('tdisp').textContent=fmt(Math.max(tLeft,0));
    if(tLeft<=0){ clearInterval(tInt); tRun=false; document.getElementById('tring').classList.add('done');
      document.getElementById('tdisp').textContent='¡Listo!'; beep(); if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }
  },1000);
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)();
  [0,.45,.9].forEach(t=>{ const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=880; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(.0001,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.35,a.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.32); o.start(a.currentTime+t); o.stop(a.currentTime+t+.35); }); }catch(e){} }
document.getElementById('tpause').onclick=e=>{ tRun=!tRun; e.target.textContent=tRun?'Pausa':'Seguir'; };
document.getElementById('tclose').onclick=()=>{ clearInterval(tInt); tRun=false; document.getElementById('timer').classList.remove('on'); };

/* ---------------- NAV ---------------- */
const R={hoy:renderHoy,compra:renderCompra,menu:renderMenu,recetas:renderRecetas,info:renderInfo};
function go(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  R[v](); window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
renderHoy();
